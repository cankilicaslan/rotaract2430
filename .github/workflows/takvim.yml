# Günde 4 kez:
#  - Bölge takvimini (Google Takvim) çekip data/etkinlikler.json'u günceller
#  - Asamble/konferans sitelerinden bilgileri çekip data/organizasyonlar.json'u günceller
# Değişiklik varsa commit atar ve GitHub Pages'i yeniden yayınlatır.
# Elle çalıştırmak için: GitHub > Actions > "Takvim ve organizasyonları güncelle" > Run workflow
name: Takvim ve organizasyonları güncelle

on:
  schedule:
    # Saatler UTC; Türkiye saatiyle 06:00, 12:00, 18:00 ve 00:00
    - cron: "0 3,9,15,21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: takvim
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Testler
        run: node --test test/etkinlik.test.mjs test/organizasyon.test.mjs

      - name: Takvimi indir
        run: node scripts/takvim.mjs

      # Organizasyon siteleri JavaScript ile çizildiği için gerçek tarayıcı gerekir
      - name: Playwright kur
        run: |
          npm i --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Organizasyon sitelerini oku
        run: node scripts/organizasyon.mjs

      - name: Değişiklik varsa kaydet
        id: kaydet
        run: |
          # git add önce: dosya ilk kez oluştuğunda (izlenmeyen dosya) da fark görülsün
          git add data/etkinlikler.json data/organizasyonlar.json
          if git diff --cached --quiet; then
            echo "degisti=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Takvim ve organizasyon bilgileri güncellendi"
            # Bu sırada biri push ettiyse önce onu al
            git pull --rebase
            git push
            echo "degisti=true" >> "$GITHUB_OUTPUT"
          fi

      # Pages "main dalından yayın" modunda; GITHUB_TOKEN push'u yayını her zaman tetiklemeyebilir, açıkça iste
      - name: GitHub Pages'i yeniden yayınla
        if: steps.kaydet.outputs.degisti == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
